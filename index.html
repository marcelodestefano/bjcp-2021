<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Completo de Estilos BJCP 2021</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --primary: #d97706;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent);
            margin-bottom: 6px;
            font-size: 2.2rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Painel de Filtros */
        .filter-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .filter-group input, .filter-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .styles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Cards de Estilos */
        .style-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .style-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .style-code {
            background-color: var(--primary);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .style-name {
            font-size: 1.15rem;
            margin: 0;
            color: #fff;
        }

        .category-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 2px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .tag-pill {
            background-color: #334155;
            color: #94a3b8;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
        }
    </style>
</head>

### 1. Interface Web (`index.html`)

Salve o código abaixo como `index.html` na raiz do seu repositório do GitHub:

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Completo de Estilos BJCP 2021</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --primary: #d97706;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent);
            margin-bottom: 6px;
            font-size: 2.2rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Painel de Filtros */
        .filter-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .filter-group input, .filter-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .styles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Cards de Estilos */
        .style-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .style-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .style-code {
            background-color: var(--primary);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .style-name {
            font-size: 1.15rem;
            margin: 0;
            color: #fff;
        }

        .category-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 2px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .tag-pill {
            background-color: #334155;
            color: #94a3b8;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍺 Guia Completo BJCP 2021</h1>
        <p>Pesquisa estruturada de todos os estilos e parâmetros de cervejas do BJCP 2021</p>
    </header>

    <!-- Painel de Filtros -->
    <div class="filter-panel">
        <div class="filter-group">
            <label for="searchInput">Busca por Palavra-Chave</label>
            <input type="text" id="searchInput" placeholder="Ex: IPA, Stout, Trigo, Saison, Pilsen, Sour...">
        </div>
        <div class="filter-group">
            <label for="categorySelect">Filtrar por Categoria</label>
            <select id="categorySelect">
                <option value="">Todas as Categorias</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="abvInput">Teor Alcoólico (% ABV)</label>
            <input type="number" id="abvInput" step="0.1" placeholder="Ex: 6.5">
        </div>
        <div class="filter-group">
            <label for="ibuInput">Amargor Mínimo (IBU)</label>
            <input type="number" id="ibuInput" placeholder="Ex: 40">
        </div>
    </div>

    <div class="results-info">
        <span id="resultsCount">Carregando banco de dados...</span>
    </div>

    <!-- Grid de Estilos -->
    <div class="styles-grid" id="stylesGrid"></div>
</div>

<script>
    let bjcpData = [];

    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('categorySelect');
    const abvInput = document.getElementById('abvInput');
    const ibuInput = document.getElementById('ibuInput');
    const stylesGrid = document.getElementById('stylesGrid');
    const resultsCount = document.getElementById('resultsCount');

    // Carrega o arquivo JSON dinamicamente
    async function loadStyles() {
        try {
            const response = await fetch('styles.json');
            bjcpData = await response.json();
            initCategories();
            renderStyles(bjcpData);
        } catch (error) {
            resultsCount.textContent = 'Erro ao carregar o arquivo styles.json.';
            console.error(error);
        }
    }

    function initCategories() {
        const categories = [...new Set(bjcpData.map(item => item.category))].sort((a, b) => {
            const numA = parseInt(a) || 999;
            const numB = parseInt(b) || 999;
            return numA - numB;
        });

        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });
    }

    function renderStyles(styles) {
        stylesGrid.innerHTML = '';
        resultsCount.textContent = `Exibindo ${styles.length} de ${bjcpData.length} estilo(s) de cerveja`;

        if (styles.length === 0) {
            stylesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Nenhum estilo encontrado com os filtros selecionados.</p>';
            return;
        }

        styles.forEach(style => {
            const card = document.createElement('div');
            card.className = 'style-card';
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <h3 class="style-name">${style.name}</h3>
                        <span class="style-code">${style.code}</span>
                    </div>
                    <div class="category-name">${style.category}</div>
                </div>
                <div>
                    <div class="stats-grid">
                        <div class="stat-item"><span class="stat-label">ABV</span><span class="stat-value">${style.abv}</span></div>
                        <div class="stat-item"><span class="stat-label">IBU</span><span class="stat-value">${style.ibu}</span></div>
                        <div class="stat-item"><span class="stat-label">SRM</span><span class="stat-value">${style.srm}</span></div>
                        <div class="stat-item"><span class="stat-label">OG</span><span class="stat-value">${style.og}</span></div>
                    </div>
                    <div class="tags-container">
                        ${(style.tags || []).map(tag => `<span class="tag-pill">\${tag}</span>`).join('')}
                    </div>
                </div>
            `;
            stylesGrid.appendChild(card);
        });
    }

    function filterStyles() {
        const query = searchInput.value.toLowerCase().trim();
        const selectedCat = categorySelect.value;
        const targetAbv = parseFloat(abvInput.value);
        const minIbu = parseFloat(ibuInput.value);

        const filtered = bjcpData.filter(style => {
            const textMatch = !query || 
                style.name.toLowerCase().includes(query) || 
                style.code.toLowerCase().includes(query) || 
                style.category.toLowerCase().includes(query) ||
                (style.tags && style.tags.some(t => t.toLowerCase().includes(query)));

            const catMatch = !selectedCat || style.category === selectedCat;

            const abvMatch = isNaN(targetAbv) || 
                (style.abvMin !== undefined && style.abvMax !== undefined && targetAbv >= style.abvMin && targetAbv <= style.abvMax) ||
                style.abv === "Varia";

            const ibuMatch = isNaN(minIbu) || 
                (style.ibuMax !== undefined && style.ibuMax >= minIbu) ||
                style.ibu === "Varia";

            return textMatch && catMatch && abvMatch && ibuMatch;
        });

        renderStyles(filtered);
    }

    searchInput.addEventListener('input', filterStyles);
    categorySelect.addEventListener('change', filterStyles);
    abvInput.addEventListener('input', filterStyles);
    ibuInput.addEventListener('input', filterStyles);

    loadStyles();
</script>

</body>
</html>
