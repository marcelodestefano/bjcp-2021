<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estilos BJCP 2021 - Texto Completo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --modal-bg: #1e293b;
            --accent: #f59e0b;
            --primary: #d97706;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent);
            margin-bottom: 6px;
        }

        .filter-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .filter-group input, .filter-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
        }

        .styles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .style-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .style-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .style-code {
            background-color: var(--primary);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-top: 10px;
        }

        .stat-value {
            color: var(--accent);
            font-weight: bold;
        }

        /* Modal para Leitura Completa */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 850px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-muted); font-size: 1.8rem; cursor: pointer;
        }

        .modal-section {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .modal-section h3 {
            color: var(--primary);
            margin-bottom: 4px;
        }

        .tag-pill {
            background-color: #334155;
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-right: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍺 Guia Completo BJCP 2021</h1>
        <p>Acesso integral a todas as descrições sensoriais, história, ingredientes e estatísticas do PDF oficial</p>
    </header>

    <div class="filter-panel">
        <div class="filter-group">
            <label for="searchInput">Busca por Palavra-Chave / Texto</label>
            <input type="text" id="searchInput" placeholder="Ex: Lúpulo, Cravo, Banana, Pilsen, Carvalho...">
        </div>
        <div class="filter-group">
            <label for="abvInput">Teor Alcoólico (% ABV)</label>
            <input type="number" id="abvInput" step="0.1" placeholder="Ex: 5.5">
        </div>
        <div class="filter-group">
            <label for="ibuInput">Amargor Mínimo (IBU)</label>
            <input type="number" id="ibuInput" placeholder="Ex: 30">
        </div>
    </div>

    <div class="styles-grid" id="stylesGrid"></div>
</div>

<!-- Modal com o Texto Completo do Estilo -->
<div class="modal-overlay" id="styleModal">
    <div class="modal-content" id="modalBody"></div>
</div>

<script>
    // Carrega o banco de dados gerado
    const searchInput = document.getElementById('searchInput');
    const abvInput = document.getElementById('abvInput');
    const ibuInput = document.getElementById('ibuInput');
    const stylesGrid = document.getElementById('stylesGrid');
    const styleModal = document.getElementById('styleModal');

    // Executa a renderização dos cards e modais de texto completo
    function renderStyles(styles) {
        stylesGrid.innerHTML = '';
        styles.forEach(style => {
            const card = document.createElement('div');
            card.className = 'style-card';
            card.onclick = () => openModal(style.code);
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0; color:#fff;">${style.name}</h3>
                    <span class="style-code">${style.code}</span>
                </div>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">${style.category}</div>
                <p style="font-size:0.85rem; color:#cbd5e1;">${style.overall_impression || ''}</p>
                <div class="stats-grid">
                    <div><span class="stat-value">${style.stats.abv}</span><br><small>ABV</small></div>
                    <div><span class="stat-value">${style.stats.ibu}</span><br><small>IBU</small></div>
                    <div><span class="stat-value">${style.stats.srm}</span><br><small>SRM</small></div>
                    <div><span class="stat-value">${style.stats.og}</span><br><small>OG</small></div>
                </div>
            `;
            stylesGrid.appendChild(card);
        });
    }

    function openModal(code) {
        const style = bjcpData.find(s => s.code === code);
        if (!style) return;

        document.getElementById('modalBody').innerHTML = `
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 style="color:var(--accent);">[${style.code}] ${style.name}</h2>
            <p style="color:var(--text-muted);">${style.category}</p>

            <div class="modal-section"><h3>Impressão Geral</h3><p>${style.overall_impression || 'Não informado.'}</p></div>
            <div class="modal-section"><h3>Aroma</h3><p>${style.aroma || 'Não informado.'}</p></div>
            <div class="modal-section"><h3>Aparência</h3><p>${style.appearance || 'Não informado.'}</p></div>
            <div class="modal-section"><h3>Sabor</h3><p>${style.flavor || 'Não informado.'}</p></div>
            <div class="modal-section"><h3>Sensação na Boca</h3><p>${style.mouthfeel || 'Não informado.'}</p></div>
            ${style.comments ? `<div class="modal-section"><h3>Comentários</h3><p>\${style.comments}</p></div>` : ''}
            ${style.history ? `<div class="modal-section"><h3>História</h3><p>\${style.history}</p></div>` : ''}
            ${style.ingredients ? `<div class="modal-section"><h3>Ingredientes Característicos</h3><p>\${style.ingredients}</p></div>` : ''}
            ${style.commercial_examples ? `<div class="modal-section"><h3>Exemplos Comerciais</h3><p>\${style.commercial_examples}</p></div>` : ''}
            <div class="modal-section"><h3>Tags / Atributos Oficiais</h3><div>${(style.tags || []).map(t => `<span class="tag-pill">\${t}</span>`).join('')}</div></div>
        `;
        styleModal.style.display = 'flex';
    }

    function closeModal() { styleModal.style.display = 'none'; }
</script>
</body>
</html>
